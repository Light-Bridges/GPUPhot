[metadata]
name = gpuphot
version = attr: gpuphot.__version__
author = Samuel Lemes Perera
author_email = Samuel@lightbridges.es
description = GPU photometry library
long_description = file: README.md
long_description_content_type = text/markdown
url = https://lightbridges.es/
keywords = gpu, photometry
license = BSD 3-Clause License
classifiers =
    License :: OSI Approved :: BSD License
    Programming Language :: Python :: 3

[options]
packages = find:
zip_safe = True
include_package_data = True
python_requires = >=3.10
install_requires = file: requirements.txt
;install_requires = -r requirements.txt

[options.extras_require]
test =
    pytest

[options.package_data]
* = README.md, LICENSE

[options.entry_points]
console_scripts =
    # Define aquí los scripts de línea de comandos si los tienes

[options.packages.find]
exclude =
    tests
