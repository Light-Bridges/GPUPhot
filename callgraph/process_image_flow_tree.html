<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Árbol de llamadas — process_image (interactivo)</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .node { margin-left: 20px; }
    .label { font-weight: bold; cursor: pointer; }
    .meta { color: #555; margin-left: 6px; font-size: 0.95em; }
    .notes { color: #333; margin: 6px 0 12px 0; }
    .collapsed > .children { display: none; }
    .toggle { margin-right: 8px; color: #888; }
    pre { background: #f7f7f7; padding: 12px; border-radius: 6px; overflow:auto; }
  </style>
</head>
<body>
  <h1>Árbol jerárquico de llamadas — process_image (interactivo)</h1>
  <p>Versión interactiva generada automáticamente. Usa las flechas para expandir/colapsar
  nodos. El JSON fuente es <code>docs/process_image_flow_tree.json</code>.</p>

  <div id="tree"></div>

  <script>
    // Cargar JSON desde archivo local usando fetch (debe abrirse con file:// o un servidor local)
    async function loadJSON() {
      try {
        const res = await fetch('process_image_flow_tree.json');
        const data = await res.json();
        renderTree(data.entry, document.getElementById('tree'));
      } catch (err) {
        document.getElementById('tree').innerHTML = '<p style="color:red">No se pudo cargar el JSON local. Si abres este archivo con file:// en el navegador algunos navegadores bloquean fetch por seguridad. Ejecuta un servidor local (p.ej. <code>python -m http.server</code>) y abre la página vía http://localhost:8000/docs/process_image_flow_tree.html</p>' + '<pre>' + err + '</pre>';
      }
    }

    function renderTree(node, container) {
      const el = document.createElement('div');
      el.className = 'node collapsed';

      const header = document.createElement('div');
      const toggle = document.createElement('span');
      toggle.className = 'toggle';
      toggle.textContent = '▸';

      const title = document.createElement('span');
      title.className = 'label';
      title.textContent = node.label + (node.path_range ? ' — ' + node.path_range : '');

      header.appendChild(toggle);
      header.appendChild(title);
      el.appendChild(header);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = (node.type ? 'Tipo: ' + node.type + (node.line_call_site ? ' — call @' + node.line_call_site : '') : '');
      el.appendChild(meta);

      if (node.notes) {
        const notes = document.createElement('div');
        notes.className = 'notes';
        notes.textContent = node.notes;
        el.appendChild(notes);
      }

      const children = document.createElement('div');
      children.className = 'children';

      // calls_sequence is an array
      const calls = node.calls_sequence || node.calls || [];
      calls.forEach(child => {
        renderTree(child, children);
      });

      // Decisions and extra nested objects
      if (node.decision) {
        const dec = document.createElement('pre');
        dec.textContent = 'Decision: ' + JSON.stringify(node.decision, null, 2);
        children.appendChild(dec);
      }

      if (node.grouping_dispatch) {
        const gd = document.createElement('div');
        gd.innerHTML = '<div class="meta">Agrupamiento (dispatch):</div>';
        renderTree(node.grouping_dispatch, gd);
        children.appendChild(gd);
      }

      if (node.on_exception) {
        const oe = document.createElement('pre');
        oe.textContent = 'on_exception: ' + JSON.stringify(node.on_exception, null, 2);
        children.appendChild(oe);
      }

      el.appendChild(children);
      container.appendChild(el);

      header.addEventListener('click', () => {
        if (el.classList.contains('collapsed')) {
          el.classList.remove('collapsed');
          toggle.textContent = '▾';
        } else {
          el.classList.add('collapsed');
          toggle.textContent = '▸';
        }
      });

      // Auto-expand top levels
      // if (!container.id) { el.classList.remove('collapsed'); toggle.textContent='▾'; }
    }

    loadJSON();
  </script>
</body>
</html>
