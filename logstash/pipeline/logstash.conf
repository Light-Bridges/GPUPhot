# GPUPhot Logstash pipeline
# Receives JSON log records from gpuphot workers via logstash-async (TCP).
#
# Development (default): logs are written to stdout in rubydebug format.
# Production: uncomment the elasticsearch output block and configure the host.
#
# To enable log shipping from workers, set in .env:
#   LOGSTASH_LOGGING=True
#   LOGSTASH_HOST=logstash    (or the hostname / IP of a remote Logstash instance)
#   LOGSTASH_PORT=5000

input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # Promote the nested 'extra' fields added by python-logstash to top-level
  if [extra] {
    mutate { rename => { "[extra][instrument]"   => "instrument"   } }
    mutate { rename => { "[extra][environment]"  => "gpuphot_env"  } }
    mutate { rename => { "[extra][image_path]"   => "image_path"   } }
  }
}

output {
  # ── Development: pretty-print to container stdout ──────────────────────────
  stdout {
    codec => rubydebug
  }

  # ── Production: forward to Elasticsearch ───────────────────────────────────
  # Uncomment and set ELASTICSEARCH_HOST in .env to enable persistent storage.
  #
  # elasticsearch {
  #   hosts           => ["${ELASTICSEARCH_HOST:logstash}:9200"]
  #   index           => "gpuphot-logs-%{+YYYY.MM.dd}"
  #   manage_template => false
  # }
}
