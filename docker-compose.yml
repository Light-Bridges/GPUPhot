#version: '3.8'

x-celery-env: &celery-env
  CELERY_BROKER_URL: amqp://gpuphot:gpuphot@rabbitmq:5672/
  CELERY_RESULT_BACKEND: redis://redis:6379/0

x-worker-env: &worker-env
  <<: *celery-env
  INSTRUMENT_NAME: ${INSTRUMENT_NAME:-default}
  POSTGRES_DB: GPUPhotDB
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpuphot}
  INSTRUMENT_CONFIG_BASE_PATH: /data/instrument_configs
  IMAGE_BASE_PATH: /data/images

x-gpu-env: &gpu-env
  GPU_ID: ${GPU_ID:-0}
  # -----------------------------------------------------------------------------------------
  # LEGATE / CUPYNUMERIC MEMORY CONFIGURATION
  # -----------------------------------------------------------------------------------------
  # When running Legate-based applications (like cuPyNumeric) via standard Python interpreters
  # (e.g., Celery workers), the runtime ignores standard environment variables like LEGATE_FBMEM.
  # Instead, configuration MUST be passed via the 'LEGATE_CONFIG' environment variable.
  #
  # This variable constructs a command-line-like string of options for the Legate runtime.
  #
  # Configuration Flags:
  #   --fbmem <MB> : Framebuffer Memory (GPU VRAM).
  #                  The amount of GPU memory reserved for the application.
  #                  Default: 1024 MB (1GB). Increase this for larger image processing tasks.
  #
  #   --sysmem <MB>: System Memory (CPU DRAM).
  #                  The amount of host RAM reserved for the application runtime.
  #                  Default: 2048 MB (2GB).
  #
  #   --zcmem <MB> : Zero-Copy Memory (Pinned/Mapped Memory).
  #                  Host memory mapped into the GPU address space for fast data transfers.
  #                  Default: 256 MB.
  #
  # Usage:
  #   You can override these defaults by setting the corresponding environment variables
  #   (LEGATE_FBMEM, LEGATE_SYSMEM, LEGATE_ZCMEM) in your .env file.
  # -----------------------------------------------------------------------------------------
  LEGATE_CONFIG: "--fbmem ${LEGATE_FBMEM:-1024} --sysmem ${LEGATE_SYSMEM:-2048} --zcmem ${LEGATE_ZCMEM:-256}"

x-common-worker-backend: &common-worker-backend
  build:
    context: .
    dockerfile: Dockerfile
    target: worker
    args:
      - BASE_IMAGE=${BASE_IMAGE:-nvidia/cuda:12.6.3-devel-ubuntu24.04}
      - REQUIREMENTS_FILE=${REQUIREMENTS_FILE:-requirements-312.txt}
  #  env_file:
  #    - path: ./.env
  #      required: false
  volumes:
    - ${INSTRUMENT_CONFIG_PATH:-./gpuphot/instrument_configs}:/data/instrument_configs:z
    - ${IMAGE_PATH:-~/gpuphot_images}:/data/images:z
    - ${ASTROMETRY_CACHE_PATH:-./astrometry_cache}:/data/astrometry_cache:z
    - /run/docker.sock:/run/docker.sock
  depends_on:
    - rabbitmq
    - redis
  restart: unless-stopped

x-common-profiler: &common-profiler
  build:
    context: .
    dockerfile: Dockerfile
    target: profiler
    args:
      - ROOT_PASSWORD=${ROOT_PASSWORD:-gpuphot_profiler}
      - SSSH_PORT=${PROFILER_SSSH_PORT:-2222}
      - BASE_IMAGE=${PROFILER_BASE_IMAGE:-nvidia/cuda:12.6.3-devel-ubuntu24.04}
      - REQUIREMENTS_FILE=${PROFILER_REQUIREMENTS_FILE:-requirements-312.txt}
  profiles: [ "debug" ]
  privileged: true
  environment:
    <<: [*worker-env, *gpu-env]
    NVIDIA_PERSISTENCE_MODE: "on"
    CUDA_DEVICE_ORDER: PCI_BUS_ID
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all,compute,utility,graphics}
    NSYS_PROFILING: 1
    NSYS_CUDA_TRACE: 1
  cap_add:
    - SYS_ADMIN
    - SYS_PTRACE
    - SYS_NICE
    - IPC_LOCK
    - SYS_RESOURCE
  security_opt:
    - seccomp=unconfined
  stdin_open: true
  tty: true
  restart: unless-stopped


services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-5672}:5672"
      - "${RABBITMQ_AMQP_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: gpuphot
      RABBITMQ_DEFAULT_PASS: gpuphot
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  beat:
    <<: *common-worker-backend
    environment:
      <<: *worker-env
      NVIDIA_VISIBLE_DEVICES: "none"
      NVIDIA_DRIVER_CAPABILITIES: ""
    command: [ "celery", "-A", "gpuphot_worker.worker_app", "beat" , "-S", "redbeat.RedBeatScheduler" ]

  gpuphot_worker:
    <<: *common-worker-backend
    environment:
      <<: [*worker-env, *gpu-env]
    command: [ "celery", "-A", "gpuphot_worker.worker_app", "worker", "--pool=gevent", "-c", "${CELERY_CONCURRENCY:-1}", "-n", "gpuphot-worker-${GPU_ID:-0}", "--soft-time-limit", "240", "--time-limit", "300" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "${GPU_ID:-0}" ]
              capabilities: [ gpu ]

  lab:
    build:
      context: .
      dockerfile: Dockerfile
      target: lab
      args:
        - BASE_IMAGE=${BASE_IMAGE:-nvidia/cuda:12.6.3-devel-ubuntu24.04}
        - REQUIREMENTS_FILE=${REQUIREMENTS_FILE:-requirements-312.txt}
    #    env_file:
    #      - path: ./.env
    #        required: false
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      <<: [*celery-env, *gpu-env]
      JUPYTER_ENABLE_LAB: "yes"
      INSTRUMENT_NAME: ${INSTRUMENT_NAME:-default}
      INSTRUMENT_CONFIG_BASE_PATH: /data/instrument_configs
      IMAGE_BASE_PATH: /data/images
      ASTROMETRY_CACHE_PATH_HOST: ${ASTROMETRY_CACHE_PATH:-./astrometry_cache}
    volumes:
      - ${NOTEBOOKS_PATH:-./notebooks}:/home/jovyan/work:z
      - ${INSTRUMENT_CONFIG_PATH:-./gpuphot/instrument_configs}:/data/instrument_configs:z
      - ${IMAGE_PATH:-~/gpuphot_images}:/data/images:z
      - ${ASTROMETRY_CACHE_PATH:-./astrometry_cache}:/data/astrometry_cache:z
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
      args:
        - BASE_IMAGE=${BASE_IMAGE:-nvidia/cuda:12.6.3-devel-ubuntu24.04}
        - REQUIREMENTS_FILE=${REQUIREMENTS_FILE:-requirements-312.txt}
    environment:
      <<: *celery-env
      NVIDIA_VISIBLE_DEVICES: "none"
      NVIDIA_DRIVER_CAPABILITIES: ""
      FLOWER_PORT: 5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - rabbitmq
      - redis
    command: [ "celery", "-A", "gpuphot_worker.worker_app", "flower" ]
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: Dockerfile
      target: q3c_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: GPUPhotDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpuphot}
    volumes:
      - ${POSTGRES_DATA_PATH:-./gpuphot_database}:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  # ---------------------------------------------------------------
  #  Profiler (Python 3.12) — default, with RAPIDS cuML
  # ---------------------------------------------------------------
  profiler:
    <<: *common-profiler
    build:
      context: .
      dockerfile: Dockerfile
      target: profiler
      args:
        - ROOT_PASSWORD=${ROOT_PASSWORD:-gpuphot_profiler}
        - SSSH_PORT=${PROFILER_SSSH_PORT:-2222}
        - BASE_IMAGE=${PROFILER_BASE_IMAGE:-nvidia/cuda:12.6.3-devel-ubuntu24.04}
        - REQUIREMENTS_FILE=${PROFILER_REQUIREMENTS_FILE:-requirements-312.txt}
    ports:
      - "${PROFILER_SSSH_PORT:-2222}:22"
    devices:
      - "/dev/nvidiactl:/dev/nvidiactl"
      - "/dev/nvidia-uvm:/dev/nvidia-uvm"
      - "/dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools"
      - "/dev/nvidia-modeset:/dev/nvidia-modeset"
    volumes:
      - ${INSTRUMENT_CONFIG_PATH:-./gpuphot/instrument_configs}:/data/instrument_configs:z
      - ${IMAGE_PATH:-~/gpuphot_images}:/data/images:z
      - ${ASTROMETRY_CACHE_PATH:-./astrometry_cache}:/data/astrometry_cache:z
      - ${PROFILER_RESULTS_PATH:-./profiling_results}:/app/profiling_results:z
      - /var/run/nvidia-persistenced/socket:/var/run/nvidia-persistenced/socket
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "${GPU_ID:-0}" ]
              capabilities: [ gpu ]

  # ---------------------------------------------------------------
  #  Profiler (Python 3.8) — legacy, CPU fallbacks for cuML tasks
  # ---------------------------------------------------------------
  profiler_38:
    <<: *common-profiler
    build:
      context: .
      dockerfile: Dockerfile
      target: profiler
      args:
        - ROOT_PASSWORD=${ROOT_PASSWORD:-gpuphot_profiler}
        - SSSH_PORT=${PROFILER_38_SSSH_PORT:-2223}
        - BASE_IMAGE=${PROFILER_38_BASE_IMAGE:-nvidia/cuda:12.2.2-devel-ubuntu22.04}
        - REQUIREMENTS_FILE=${PROFILER_38_REQUIREMENTS_FILE:-requirements.txt}
        - FORCE_PYTHON_VERSION=${PROFILER_38_PYTHON_VERSION:-3.8}
    ports:
      - "${PROFILER_38_SSSH_PORT:-2223}:22"
    devices:
      - "/dev/nvidiactl:/dev/nvidiactl"
      - "/dev/nvidia-uvm:/dev/nvidia-uvm"
      - "/dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools"
      - "/dev/nvidia-modeset:/dev/nvidia-modeset"
    volumes:
      - ${INSTRUMENT_CONFIG_PATH:-./gpuphot/instrument_configs}:/data/instrument_configs:z
      - ${IMAGE_PATH:-~/gpuphot_images}:/data/images:z
      - ${ASTROMETRY_CACHE_PATH:-./astrometry_cache}:/data/astrometry_cache:z
      - ${PROFILER_RESULTS_PATH:-./profiling_results}:/app/profiling_results:z
      - /var/run/nvidia-persistenced/socket:/var/run/nvidia-persistenced/socket
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "${GPU_ID:-0}" ]
              capabilities: [ gpu ]

  profiler_jetson:
    <<: *common-profiler
    devices:
      - "/dev/nvhost-ctrl:/dev/nvhost-ctrl"
      - "/dev/nvhost-ctrl-gpu:/dev/nvhost-ctrl-gpu"
      - "/dev/nvhost-prof-gpu:/dev/nvhost-prof-gpu"
      - "/dev/nvmap:/dev/nvmap"
      - "/dev/nvhost-gpu:/dev/nvhost-gpu"
      - "/dev/nvhost-as-gpu:/dev/nvhost-as-gpu"
    volumes:
      - ${INSTRUMENT_CONFIG_PATH:-./gpuphot/instrument_configs}:/data/instrument_configs:z
      - ${IMAGE_PATH:-~/gpuphot_images}:/data/images:z
      - ${ASTROMETRY_CACHE_PATH:-./astrometry_cache}:/data/astrometry_cache:z
      - ${PROFILER_RESULTS_PATH:-./profiling_results}:/app/profiling_results:z
      - ${NSYS_PATH:-/opt/nvidia/nsight-systems/2024.2.2/}:/opt/nsight-systems-host         #readlink -f $(which nsys)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "${GPU_ID:-0}" ]
              capabilities: [ gpu ]

  profiler_jetson_orin:
    <<: *common-profiler
    runtime: nvidia
    devices:
      - "/dev/nvhost-ctrl:/dev/nvhost-ctrl"
      - "/dev/nvhost-ctrl-gpu:/dev/nvhost-ctrl-gpu"
      - "/dev/nvhost-prof-gpu:/dev/nvhost-prof-gpu"
      - "/dev/nvmap:/dev/nvmap"
      - "/dev/nvhost-gpu:/dev/nvhost-gpu"
      - "/dev/nvhost-as-gpu:/dev/nvhost-as-gpu"
      - "/dev/nvhost-dbg-gpu:/dev/nvhost-dbg-gpu"
    volumes:
      - ${INSTRUMENT_CONFIG_PATH:-./gpuphot/instrument_configs}:/data/instrument_configs:z
      - ${IMAGE_PATH:-~/gpuphot_images}:/data/images:z
      - ${ASTROMETRY_CACHE_PATH:-./astrometry_cache}:/data/astrometry_cache:z
      - ${PROFILER_RESULTS_PATH:-./profiling_results}:/app/profiling_results:z
      - ${NSYS_PATH:-/opt/nvidia/nsight-systems/2023.2.4/}:/opt/nsight-systems-host         #readlink -f $(which nsys)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "${GPU_ID:-0}" ]
              capabilities: [ gpu ]
